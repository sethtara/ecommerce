# --- USER SERVICE ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
spec:
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: ecommerce-user-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: ROOT_PATH
          value: "/user"
        - name: MONGO_URI
          valueFrom:
            secretKeyRef:
              name: ecommerce-secrets
              key: MONGO_URI
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: ecommerce-config
              key: DB_NAME_USER
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service
  ports:
  - port: 8000
    targetPort: 8000

